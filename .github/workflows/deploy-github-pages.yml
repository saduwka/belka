name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Те же vars, что и у deploy: иначе BELKA_API_URL, заданная только в Environment github-pages, не попадёт в сборку.
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Check BELKA_API_URL for Vite bundle
        env:
          API_URL: ${{ vars.BELKA_API_URL || secrets.BELKA_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::BELKA_API_URL пустая — в бандл не попадёт VITE_API_URL, запросы к бэку не пойдут. Задай Repository variable или Secret BELKA_API_URL (https://… без слеша в конце). Environment: github-pages."
          else
            echo "OK: API URL задан (длина ${#API_URL} символов)"
          fi
      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Variable имеет приоритет; если пусто — secret (удобно, если URL не хотите светить в vars)
          VITE_API_URL: ${{ vars.BELKA_API_URL || secrets.BELKA_API_URL }}
          # Опционально, если пути на бэке не /api/ai/bot-move и /api/ai/save-game
          VITE_AI_BOT_MOVE_PATH: ${{ vars.BELKA_AI_BOT_MOVE_PATH }}
          VITE_AI_SAVE_GAME_PATH: ${{ vars.BELKA_AI_SAVE_GAME_PATH }}
          VITE_AI_DEBUG: ${{ vars.VITE_AI_DEBUG }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
